<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Cortexa Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page">
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" onclick="toggleMobileSidebar()">☰</button>
    
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="closeMobileSidebar()"></div>
    
    <!-- Right Sidebar Toggle Button -->
    <button class="right-sidebar-toggle" onclick="toggleRightSidebar()">📋</button>

    <!-- ================= LEFT SIDEBAR ================= -->
    <div class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="Cortexa Logo" onerror="this.src='https://via.placeholder.com/140x40?text=CORTEXA'">
        </div>
        
        <div class="sidebar-nav">
            <!-- Main Features Section -->
            <div class="sidebar-section">
                <div class="section-title">MAIN</div>
                <div class="nav-item" onclick="startNewChat(event)">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4-4 8-9 8a9 9 0 01-6 2l2-3a9 9 0 01-2-6c0-4 4-8 9-8s9 4 9 8z"/>
                    </svg>
                    <span>New Chats</span>
                </div>
                
                <div class="nav-item" onclick="createProject()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7h5l3 3h10v10H3z"/>
                    </svg>
                    <span>New Projects</span>
                </div>
            </div>
            
            <!-- Learning Tools Section -->
            <div class="sidebar-section">
                <div class="section-title">LEARNING</div>
                <div class="nav-item" onclick="documentChat(); return false;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 12h6M9 16h6M4 6h16v12H4z"/>
                    </svg>
                    <span>Document Chat</span>
                </div>
                
                <div class="nav-item" onclick="openAudioMode(); return false;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h1a2 2 0 0 1 2 2z"/>
                        <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/>
                    </svg>
                    <span>Audio Explanation</span>
                </div>
                
                <div class="nav-item" onclick="openVideoMode(); return false;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 10l4-2v8l-4-2M4 6h12v12H4z"/>
                    </svg>
                    <span>Video Explanation</span>
                </div>
            </div>
            
            <!-- Productivity Section -->
            <div class="sidebar-section">
                <div class="section-title">PRODUCTIVITY</div>
                <div class="nav-item" onclick="openReportMode(); return false;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 17v-6M13 17V9M17 17v-4M3 21h18"/>
                    </svg>
                    <span>Report</span>
                </div>
                
                <div class="nav-item" onclick="openLearningTools(); return false;">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                    <span>Learning Tools</span>
                </div>
                
                <div class="nav-item" onclick="openGamesModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 6.5L21 12L15 17.5"/>
                        <path d="M9 6.5L3 12L9 17.5"/>
                        <rect x="2" y="12" width="20" height="12" rx="2"/>
                        <circle cx="6" cy="14" r="1"/>
                        <circle cx="18" cy="14" r="1"/>
                        <circle cx="12" cy="16" r="2"/>
                    </svg>
                    <span>Play Games</span>
                </div>
            </div>
        </div>
        
        <!-- Logout Section -->
        <div class="logout-section">
            <button class="logout-btn" onclick="logout()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Logout</span>
            </button>
        </div>
    </div>

    <!-- ================= MAIN CHAT AREA ================= -->
    <div class="main">
        <div id="searchResults"></div>
        
        <!-- Search Box -->
        <div class="search-box">
            <form class="chat-input-box" onsubmit="event.preventDefault(); performSearch();">
                <div class="plus-dropdown-container">
                    <button type="button" class="icon-btn plus-btn" onclick="togglePlusDropdown()">+</button>
                    <div class="plus-dropdown" id="plusDropdown">
                        <a href="#" onclick="shareChat()">📤 Share Chat</a>
                        <a href="#" onclick="pinChat()">📌 Pin Chat</a>
                        <a href="#" onclick="deleteChat()">🗑️ Delete Chat</a>
                        <a href="#">📎 Add Files</a>
                        <a href="#">🖼️ Add Images</a>
                        <a href="#">📷 Camera</a>
                        <a href="#">🔍 Deep Search</a>
                    </div>
                </div>
                <input id="searchInput" type="text" placeholder="Ask something..." />
                <button type="submit" class="send-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                        <path d="M2 21L23 12L2 3L5 12L2 21Z"/>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- ================= RIGHT SIDEBAR ================= -->
    <div class="right-sidebar">
        <h3>Your Projects</h3>
        <div id="projectListRight"></div>
        <h3 class="chat-heading">Your Chats</h3>
        <div id="chatList"></div>
    </div>

    <!-- YouTube Player Container -->
    <div id="youtubePlayerContainer" class="youtube-player-container" style="display: none;"></div>

    <!-- ================= MODALS (Keep your existing modal HTML here) ================= -->
    <!-- Audio Modal -->
    <div id="audioModal" class="audio-modal-overlay" style="display: none;">
        <!-- Your existing audio modal content -->
    </div>

    <!-- Video Modal -->
    <div id="videoModal" class="video-modal-overlay" style="display: none;">
        <!-- Your existing video modal content -->
    </div>

    <!-- Games Modal -->
    <div id="gamesModal" class="games-modal-overlay" style="display: none;">
        <!-- Your existing games modal content -->
    </div>

    <!-- Report Modal -->
    <div id="reportModal" class="report-modal-overlay" style="display: none;">
        <!-- Your existing report modal content -->
    </div>

    <!-- Learning Tools Modal -->
    <div id="learningToolsModal" class="learning-modal-overlay" style="display: none;">
        <!-- Your existing learning tools modal content -->
    </div>

    <script>
    // Toggle Functions for Mobile
    function toggleMobileSidebar() {
        document.querySelector('.sidebar').classList.toggle('open');
        document.querySelector('.sidebar-overlay').classList.toggle('show');
    }
    
    function closeMobileSidebar() {
        document.querySelector('.sidebar').classList.remove('open');
        document.querySelector('.sidebar-overlay').classList.remove('show');
    }
    
    function toggleRightSidebar() {
        document.querySelector('.right-sidebar').classList.toggle('open');
    }
    
    function togglePlusDropdown() {
        document.getElementById('plusDropdown').classList.toggle('show');
    }
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.plus-dropdown-container')) {
            document.getElementById('plusDropdown')?.classList.remove('show');
        }
    });
    
    // Authentication check
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Dashboard loaded, checking authentication...');
        const isLoggedIn = localStorage.getItem('isLoggedIn');
        
        if (!isLoggedIn || isLoggedIn !== 'true') {
            console.log('User not logged in, redirecting to login...');
            alert('Please login to access the dashboard!');
            window.location.href = 'login.html';
            return;
        }
        
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (currentUser) {
            console.log('Welcome back:', currentUser.name);
        }
        
        console.log('Authentication successful, loading dashboard...');
    });
    </script>
    
    <script src="script.js"></script>
</body>
</html>
