<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Cortexa Profile </title>
<link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">

<!-- ========= PROFILE VIEW ========= -->
<div id="profileView">
  <div class="profile-container">
    <!-- PROFILE CARD -->
    <div class="profile-card">
      <label for="uploadImg" style="cursor: pointer;">
        <img id="profileImage" class="avatar" src="avatar.png" alt="Profile Image">
      </label>
      <input type="file" id="uploadImg" accept="image/*" style="display: none;">
    </div>

    <!-- DETAILS -->
    <div class="details">
      <div class="detail-item">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter full name">
      </div>
      <div class="detail-item">
        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="Enter phone number">
      </div>
      <div class="detail-item">
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter email">
      </div>
      <div class="detail-item">
        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username">
      </div>
      <div class="detail-item">
        <label>Gender</label>
        <select id="gender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div class="detail-item">
        <label>Birthdate</label>
        <input type="date" id="birthdate">
      </div>
      <div class="detail-item">
        <label>Country</label>
        <select id="country">
          <option value="">Select Country</option>
          <option value="Afghanistan">Afghanistan</option>
          <option value="Albania">Albania</option>
          <option value="Algeria">Algeria</option>
          <option value="Andorra">Andorra</option>
          <option value="Angola">Angola</option>
          <option value="Argentina">Argentina</option>
          <option value="Armenia">Armenia</option>
          <option value="Australia">Australia</option>
          <option value="Austria">Austria</option>
          <option value="Bangladesh">Bangladesh</option>
          <option value="Belgium">Belgium</option>
          <option value="Brazil">Brazil</option>
          <option value="Canada">Canada</option>
          <option value="China">China</option>
          <option value="Denmark">Denmark</option>
          <option value="Egypt">Egypt</option>
          <option value="Finland">Finland</option>
          <option value="France">France</option>
          <option value="Germany">Germany</option>
          <option value="Greece">Greece</option>
          <option value="India">India</option>
          <option value="Indonesia">Indonesia</option>
          <option value="Iran">Iran</option>
          <option value="Iraq">Iraq</option>
          <option value="Ireland">Ireland</option>
          <option value="Israel">Israel</option>
          <option value="Italy">Italy</option>
          <option value="Japan">Japan</option>
          <option value="Malaysia">Malaysia</option>
          <option value="Mexico">Mexico</option>
          <option value="Nepal">Nepal</option>
          <option value="Netherlands">Netherlands</option>
          <option value="New Zealand">New Zealand</option>
          <option value="Norway">Norway</option>
          <option value="Pakistan">Pakistan</option>
          <option value="Philippines">Philippines</option>
          <option value="Poland">Poland</option>
          <option value="Portugal">Portugal</option>
          <option value="Russia">Russia</option>
          <option value="Saudi Arabia">Saudi Arabia</option>
          <option value="Singapore">Singapore</option>
          <option value="South Africa">South Africa</option>
          <option value="South Korea">South Korea</option>
          <option value="Spain">Spain</option>
          <option value="Sri Lanka">Sri Lanka</option>
          <option value="Sweden">Sweden</option>
          <option value="Switzerland">Switzerland</option>
          <option value="Thailand">Thailand</option>
          <option value="Turkey">Turkey</option>
          <option value="UAE">UAE</option>
          <option value="UK">UK</option>
          <option value="Ukraine">Ukraine</option>
          <option value="USA">USA</option>
          <option value="Vietnam">Vietnam</option>
        </select>
      </div>
    </div>

    <!-- SAVE BUTTON -->
    <button onclick="saveProfile()" class="save-btn">Save Changes</button>
 <!-- BACK TO HOME BUTTON - ADDED HERE -->
    <button class="back-home-btn" onclick="goToHomepage()">
        🏠 Back to Home
    </button>
   
<!-- ========= SETTINGS VIEW ========= -->
<div id="settingsView" style="display: none;">
  <div class="page-container">
    <div class="page-header">
      <button class="back-btn" onclick="showProfile()">← Back to Profile</button>
      <h1 class="page-title">⚙️ Settings</h1>
    </div>
    <div class="settings-grid">
      <div class="settings-card">
        <h3>🎨 Appearance</h3>
        <div class="setting-item">
          <label>Theme Mode</label>
          <select id="themeSelect">
            <option value="dark">Dark (Default)</option>
            <option value="light">Light</option>
            <option value="system">System Default</option>
          </select>
        </div>
        <div class="setting-item toggle-switch">
          <span class="toggle-label">🔔 Animations & Effects</span>
          <label class="toggle">
            <input type="checkbox" id="animationsToggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div class="settings-card">
        <h3>🔔 Notifications</h3>
        <div class="setting-item toggle-switch">
          <span class="toggle-label">Email Notifications</span>
          <label class="toggle">
            <input type="checkbox" id="emailNotifToggle">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item toggle-switch">
          <span class="toggle-label">Push Notifications</span>
          <label class="toggle">
            <input type="checkbox" id="pushNotifToggle">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label>Notification Sound</label>
          <select id="soundSelect">
            <option value="default">Default</option>
            <option value="none">None</option>
            <option value="gentle">Gentle Chime</option>
          </select>
        </div>
      </div>
      <div class="settings-card">
        <h3>🔒 Privacy & Security</h3>
        <div class="setting-item toggle-switch">
          <span class="toggle-label">Two-Factor Authentication</span>
          <label class="toggle">
            <input type="checkbox" id="twoFactorToggle">
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <label>Session Timeout (minutes)</label>
          <input type="number" id="sessionTimeout" min="5" max="120" value="30">
        </div>
        <div class="setting-item">
          <label>Data Usage</label>
          <select id="dataUsage">
            <option value="minimal">Minimal (Save bandwidth)</option>
            <option value="standard">Standard</option>
            <option value="high">High Quality</option>
          </select>
        </div>
      </div>
      <div class="settings-card">
        <h3>📚 Learning Preferences</h3>
        <div class="setting-item">
          <label>Default AI Model</label>
          <select id="aiModel">
            <option value="cortexa-pro">Cortexa Pro</option>
            <option value="cortexa-lite">Cortexa Lite</option>
            <option value="research-mode">Research Mode</option>
          </select>
        </div>
        <div class="setting-item">
          <label>Content Language</label>
          <select id="contentLang">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
          </select>
        </div>
      </div>
    </div>
    <button class="save-settings-btn" onclick="saveAllSettings()">💾 Save All Settings</button>
  </div>
</div>

<script>
  // ========================
  // CORTEXA DYNAMIC PROFILE
  // ========================
  // REQUIREMENTS:
  // - When new user logged in and clicks profile page -> page is NOT already filled; fields are blank.
  // - User can add their own details.
  // - Click "Save Changes" -> details saved (persist across reloads).
  // - Click "Logout" -> all profile details removed, avatar cleared, fields become empty again.
  // - Also "Back to Home" button navigates to homepage (simulated with alert + redirect attempt)
  // - This version uses localStorage, but logout DELETES profile data completely.
  
  // DOM elements
  const profileImg = document.getElementById('profileImage');
  const uploadInput = document.getElementById('uploadImg');
  const fullNameInput = document.getElementById('fullName');
  const phoneInput = document.getElementById('phone');
  const emailInput = document.getElementById('email');
  const usernameInput = document.getElementById('username');
  const genderSelect = document.getElementById('gender');
  const birthdateInput = document.getElementById('birthdate');
  const countrySelect = document.getElementById('country');

  // Helper: Show toast notification (reuses style from style.css .toast-message)
  function showToast(message, isError = false) {
    // remove existing toast if any
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();
    
    const toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.textContent = message;
    if (isError) {
      toast.style.background = "linear-gradient(90deg, #ef4444, #dc2626)";
    } else {
      toast.style.background = "linear-gradient(90deg, #22c55e, #16a34a)";
    }
    document.body.appendChild(toast);
    setTimeout(() => {
      if (toast && toast.remove) toast.remove();
    }, 2800);
  }

  // Clear all profile fields (set to empty / default placeholder)
  function clearAllProfileFields() {
    fullNameInput.value = '';
    phoneInput.value = '';
    emailInput.value = '';
    usernameInput.value = '';
    genderSelect.value = '';        // selects default disabled option
    birthdateInput.value = '';
    countrySelect.value = '';       // selects disabled first option
  }

  // Load profile data from localStorage (if exists)
  // IMPORTANT: If no data exists -> fields remain BLANK (no static prefilled content)
  function loadProfileData() {
    const savedProfile = localStorage.getItem('cortexa_user_profile');
    if (savedProfile) {
      try {
        const data = JSON.parse(savedProfile);
        fullNameInput.value = data.fullName || '';
        phoneInput.value = data.phone || '';
        emailInput.value = data.email || '';
        usernameInput.value = data.username || '';
        genderSelect.value = data.gender || '';
        birthdateInput.value = data.birthdate || '';
        countrySelect.value = data.country || '';
      } catch(e) {
        console.warn("Error parsing profile", e);
        clearAllProfileFields();
      }
    } else {
      // NEW USER scenario: absolutely blank
      clearAllProfileFields();
    }
    
    // Load avatar image if exists
    const savedAvatar = localStorage.getItem('cortexa_user_avatar');
    if (savedAvatar && savedAvatar.startsWith('data:image')) {
      profileImg.src = savedAvatar;
    } else {
      // default neutral avatar (blank state)
      profileImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239ca3af'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
    }
  }

  // Save current profile data to localStorage
  function saveProfile() {
    const profileData = {
      fullName: fullNameInput.value,
      phone: phoneInput.value,
      email: emailInput.value,
      username: usernameInput.value,
      gender: genderSelect.value,
      birthdate: birthdateInput.value,
      country: countrySelect.value,
      lastUpdated: new Date().toISOString()
    };
    localStorage.setItem('cortexa_user_profile', JSON.stringify(profileData));
    showToast('✅ Profile details saved successfully!');
  }

  // Save avatar image to localStorage
  function saveAvatar(imageDataUrl) {
    localStorage.setItem('cortexa_user_avatar', imageDataUrl);
  }

  // LOGOUT: removes all user data (profile + avatar). Fields become empty.
  function logoutAndClearData() {
    // Remove profile data and avatar from localStorage
    localStorage.removeItem('cortexa_user_profile');
    localStorage.removeItem('cortexa_user_avatar');
    // Also clear any additional session flags if needed
    localStorage.removeItem('cortexa_settings');  // optional
    
    // Reset all fields to blank immediately
    clearAllProfileFields();
    // Reset avatar to default blank icon
    profileImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239ca3af'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E";
    
    showToast('🚪 Logged out successfully. All profile data removed.');
    
    // Optional: redirect to login page after short delay to mimic full logout flow
    setTimeout(() => {
      // In real scenario you'd redirect to login/index. Since we have Back to Home, 
      // we can optionally redirect to a home/demo page. But spec says "details removed".
      // For better UX, we stay on profile but everything cleared. But to match "back to home",
      // we could optionally reload. However we just keep page cleared.
      // also reset any "logged in" flags
      sessionStorage.clear(); // extra cleanup
    }, 500);
  }

  // ----- AVATAR UPLOAD HANDLER -----
  function setupAvatarUpload() {
    const avatarContainer = document.querySelector('.profile-card');
    if (avatarContainer) {
      avatarContainer.addEventListener('click', (e) => {
        // prevent if clicking on image triggers double? but it's fine
        uploadInput.click();
      });
    }
    // also directly on image if needed
    if (profileImg) {
      profileImg.style.cursor = 'pointer';
      profileImg.addEventListener('click', (e) => {
        e.stopPropagation();
        uploadInput.click();
      });
    }
    
    uploadInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file && file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function(event) {
          const imageUrl = event.target.result;
          profileImg.src = imageUrl;
          saveAvatar(imageUrl);
          showToast('🖼️ Profile picture updated!');
        };
        reader.readAsDataURL(file);
      } else if (file) {
        showToast('❌ Please select a valid image file.', true);
      }
      uploadInput.value = '';
    });
  }

  // Back to Home function (navigate to index.html / homepage)
  function goToHomepage() {
    // In a real app you'd redirect to main dashboard or landing page.
    // Since the requirement: "when they click to logout the details removed", 
    // and Back to Home just navigates. We simulate actual redirect.
    // If you have index.html in same directory, it will work.
    showToast('🏠 Returning to home page...');
    setTimeout(() => {
      // Attempt to navigate to homepage (index.html). If file exists it works.
      window.location.href = 'index.html';
    }, 300);
  }

  // ========= ADD LOGOUT BUTTON DYNAMICALLY =========
  // Since style.css has .profile-buttons but not mandatory, we manually inject a logout button
  // below the back-home button to match the requirement "logout removes details".
  function injectLogoutButton() {
    const container = document.querySelector('.profile-container');
    if (!container) return;
    // Check if logout button already exists to avoid duplication
    if (document.getElementById('dynamicLogoutBtn')) return;
    
    const logoutBtn = document.createElement('button');
    logoutBtn.id = 'dynamicLogoutBtn';
    logoutBtn.className = 'back-home-btn';  // reuse same style, distinct color customization
    logoutBtn.style.background = "linear-gradient(90deg, #ef4444, #dc2626)";
    logoutBtn.style.marginTop = "12px";
    logoutBtn.innerHTML = '🚪 Logout & Clear My Data';
    logoutBtn.onclick = () => {
      if (confirm('Are you sure you want to logout? All your profile details will be permanently removed from this device.')) {
        logoutAndClearData();
      }
    };
    // Append after "Back to Home" button
    const existingHomeBtn = document.querySelector('.back-home-btn');
    if (existingHomeBtn) {
      existingHomeBtn.insertAdjacentElement('afterend', logoutBtn);
    } else {
      container.appendChild(logoutBtn);
    }
  }

  // Optional: For demonstration, ensure that if there's any leftover fake data from demo it's purged?
  // Also we make sure that when page loads FIRST TIME, if there is no 'cortexa_user_profile' key,
  // fields are empty. That's handled by loadProfileData.
  
  // Extra safeguard: Ensure any "default static" previous data from other demos is ignored.
  // We also enforce that the profile loads as blank unless user explicitly saved.
  // This fully matches: "page is not already filled, user can see blank and add their details".
  
  // For overriding any possible prefill from previous cache, we do a hard reset if URL param 'reset' is present? Not needed.
  
  // ========= SETTINGS VIEW TOGGLE (unused in profile but kept for consistency) =========
  window.showProfile = function() {
    document.getElementById('profileView').style.display = 'block';
    document.getElementById('settingsView').style.display = 'none';
    loadProfileData(); // ensure latest profile data visible
  };
  
  window.saveAllSettings = function() {
    // dummy function for settings integrity
    const settings = {
      theme: document.getElementById('themeSelect')?.value || 'dark'
    };
    localStorage.setItem('cortexa_settings', JSON.stringify(settings));
    showToast('⚙️ Settings saved (demo)');
  };
  
  // Initial load
  document.addEventListener('DOMContentLoaded', () => {
    // Clear any residual full page cache? no. But force load fresh blank state.
    // Ensure no pre-filled default text from any old localStorage that might have "Darshita Gondaliya" remnants.
    // Only if we want to guarantee blank for new session, we can optionally remove legacy key for demo.
    // But the requirement demands: "when new user logged in they click profile page, page is NOT already filled".
    // We respect that: if there's no stored profile, all fields empty.
    // Additionally, we also delete any previous "example" data on first load if a special flag? 
    // Actually we want to simulate fresh experience: If there is any existing 'cortexa_user_profile' it stays,
    // but we are not pre-filling with static demo content (like Darshita details). So good.
    
    loadProfileData();
    setupAvatarUpload();
    injectLogoutButton();  // Adds visible logout button that removes all details
    
    // Small tweak: show visual hint that profile is empty until saved.
    if (!localStorage.getItem('cortexa_user_profile')) {
      // optional gentle reminder
      console.log("Fresh profile: all fields empty, ready for new user input.");
    }
  });
  
  // Expose functions globally for inline onclick usage
  window.saveProfile = saveProfile;
  window.goToHomepage = goToHomepage;
  window.logoutAndClearData = logoutAndClearData; // for any extra reference
  
  // Also override any previous accidental saved data from other scripts? Not necessary.
</script>
</body>
</html>
